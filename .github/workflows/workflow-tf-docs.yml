name: Terraform Docs

on:
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'

permissions:
  contents: write

jobs:
  generate:
    name: CI generate docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Terraform documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra/terraform
          config-file: ${{ github.workspace }}/.terraform-docs.yml
          output-file: ${{ github.workspace }}/docs/content/architecture/05-deployed-infrastructure.md
          output-method: inject
          git-push: "false"

      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet -- "docs/content/architecture/05-deployed-infrastructure.md"; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected"
          fi

      - name: Commit and Push Changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B chore/update-tf-docs
          git add docs/content/architecture/05-deployed-infrastructure.md
          git commit -m "docs(terraform): update generated documentation"
          git push -f origin chore/update-tf-docs
