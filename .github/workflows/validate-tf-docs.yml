name: Validate Terraform Docs

on:
  workflow_call:

permissions:
  contents: read

env:
  TERRAFORM_DOCS_OUTPUT_FILE: docs/content/reference/architecture/deployed-infrastructure.md

jobs:
  generate:
    name: CI generate docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}

      - name: Terraform Init
        run: terraform init -input=false -backend=false
        working-directory: infra/terraform

      - name: Generate Terraform documentation
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: infra/terraform
          config-file: ${{ github.workspace }}/.terraform-docs.yml
          output-file: ${{ github.workspace }}/${{ env.TERRAFORM_DOCS_OUTPUT_FILE }}
          output-method: inject
          git-push: "false"

      - name: Check generated documentation
        run: |
          test -f ${{ env.TERRAFORM_DOCS_OUTPUT_FILE }}
          git ls-files --error-unmatch ${{ env.TERRAFORM_DOCS_OUTPUT_FILE }}
          git diff --exit-code -- ${{ env.TERRAFORM_DOCS_OUTPUT_FILE }}
