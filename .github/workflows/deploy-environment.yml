name: 'Deploy Environment'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: string
    outputs:
      deploy_url:
        description: "The deployment URL"
        value: ${{ jobs.deploy.outputs.deploy_url }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      DEVELOPMENT_BASIC_AUTH_PASSWORD:
        required: false

jobs:
  deploy:
    name: 'Provision & deploy environment'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      deploy_url: ${{ steps.tf-outputs.outputs.deploy_url }}
    permissions:
      id-token: write
      contents: read
      actions: read

    defaults:
      run:
        working-directory: ./infra/terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_OIDC: true
      DEPLOY_ZIP_PATH: "../../.artifacts/webapp.zip"
      TF_VAR_development_basic_auth_password: ${{ secrets.DEVELOPMENT_BASIC_AUTH_PASSWORD }}
      TF_VAR_google_tag_manager_container_id: ${{ vars.GOOGLE_TAG_MANAGER_CONTAINER_ID }}
      BOOTSTRAP_TF: ${{ vars.BOOTSTRAP_TF }}

    steps:
    - name: Download Infra Metadata
      uses: actions/download-artifact@v8
      with:
        name: build-infra-metadata
        path: .

    - name: Read Terraform Version
      id: tf-version
      working-directory: .
      run: |
        VERSION=$(jq -r .terraform build-infra-metadata.json)
        echo "TF_VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Download Infra Package
      uses: actions/download-artifact@v8
      with:
        name: infra-package
        path: ./infra

    - name: Unzip Infra Package
      run: unzip -o infra-package.zip
      working-directory: ./infra

    - name: Download web app artifact
      uses: actions/download-artifact@v8
      with:
        name: web-app
        path: ./.artifacts/web-app

    - name: Zip web app
      run: |
        cd ../../.artifacts/web-app
        zip -r ../webapp.zip .
      working-directory: ./infra/terraform

    - name: Azure Login (OIDC)
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get Terraform State Details
      id: tf-backend
      working-directory: .
      run: |
        RG_NAME=$(jq -r '.resourceGroupName.value' infra/bicep/environments/${{ inputs.environment }}.params.json)
        ACC_NAME=$(jq -r '.storageAccountName.value' infra/bicep/environments/${{ inputs.environment }}.params.json)
        echo "resourceGroupName=$RG_NAME" >> "$GITHUB_OUTPUT"
        echo "storageAccountName=$ACC_NAME" >> "$GITHUB_OUTPUT"

    - name: Get Workflow Service Principal Object ID
      id: get-sp-id
      if: env.BOOTSTRAP_TF != 'false'
      run: |
        SP_OBJECT_ID=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query id -o tsv)
        echo "object_id=$SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

    - name: Bootstrap Terraform
      id: bootstrap-tf
      if: env.BOOTSTRAP_TF != 'false'
      uses: azure/arm-deploy@v2
      with:
        scope: subscription
        region: uksouth
        template: ./infra/bicep/main.bicep
        deploymentName: terraform-${{ inputs.environment }}
        parameters: ./infra/bicep/environments/${{ inputs.environment }}.params.json workflowPrincipalId=${{ steps.get-sp-id.outputs.object_id }}

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_wrapper: false
        terraform_version: ${{ env.TF_VERSION }}

    - name: Unlock Terraform State
      working-directory: ./infra
      env:
        ACC_NAME: ${{ steps.tf-backend.outputs.storageAccountName }}
        RG_NAME: ${{ steps.tf-backend.outputs.resourceGroupName }}
      shell: bash
      run: |
        chmod +x scripts/manage-storage-access.sh
        ./scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" "true"

    - name: Terraform Init
      run: |
        terraform init \
          -backend-config="resource_group_name=${{ steps.tf-backend.outputs.resourceGroupName }}" \
          -backend-config="storage_account_name=${{ steps.tf-backend.outputs.storageAccountName }}"

    - name: Terraform Plan
      run: terraform plan -no-color -out=main.tfplan -var-file="environments/${{ inputs.environment }}.tfvars"

    - name: Terraform Apply
      run: terraform apply -auto-approve main.tfplan

    - name: Read Terraform outputs
      id: tf-outputs
      run: |
        echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
        echo "web_app_name=$(terraform output -raw web_app_name)" >> "$GITHUB_OUTPUT"
        FRONTDOOR_HOSTNAME=$(terraform output -raw frontdoor_hostname)
        echo "frontdoor_hostname=$FRONTDOOR_HOSTNAME" >> "$GITHUB_OUTPUT"
        echo "deploy_url=https://$FRONTDOOR_HOSTNAME" >> "$GITHUB_OUTPUT"
        echo "staging_slot_in_use=$(terraform output -raw staging_slot_in_use)" >> "$GITHUB_OUTPUT"
        echo "shutter_storage_account_name=$(terraform output -raw shutter_storage_account_name)" >> "$GITHUB_OUTPUT"

    - name: Lock Terraform State
      if: ${{ always() }}
      working-directory: ./infra
      env:
        ACC_NAME: ${{ steps.tf-backend.outputs.storageAccountName }}
        RG_NAME: ${{ steps.tf-backend.outputs.resourceGroupName }}
      shell: bash
      run: |
        chmod +x scripts/manage-storage-access.sh
        ./scripts/manage-storage-access.sh "$ACC_NAME" "$RG_NAME" "false"

    - name: Deploy Web App (Zip Deploy)
      env:
        RG_NAME: ${{ steps.tf-outputs.outputs.resource_group_name }}
        APP_NAME: ${{ steps.tf-outputs.outputs.web_app_name }}
      run: |
        APP_ARGS=(
          --resource-group "$RG_NAME"
          --name "$APP_NAME"
          --src-path "$DEPLOY_ZIP_PATH"
          --async true
          --clean true
        )

        if [ "${{ steps.tf-outputs.outputs.staging_slot_in_use }}" == "true" ]; then
          APP_ARGS+=(--slot staging)
        fi

        az webapp deploy "${APP_ARGS[@]}"
    
    - name: Swap Staging to Production
      if: ${{ steps.tf-outputs.outputs.staging_slot_in_use == 'true' }}
      env:
        RG_NAME: ${{ steps.tf-outputs.outputs.resource_group_name }}
        APP_NAME: ${{ steps.tf-outputs.outputs.web_app_name }}
      run: |
        az webapp deployment slot swap \
          --resource-group "$RG_NAME" \
          --name "$APP_NAME" \
          --slot staging \
          --target-slot production

    - name: Download shutter content artifact
      uses: actions/download-artifact@v8
      with:
        name: shutter-content
        path: ./shutter

    - name: Unzip shutter content
      working-directory: ./shutter
      run: unzip -o shutter-content.zip -d extracted-content

    - name: Deploy shutter content to Azure Storage
      working-directory: ./shutter
      env:
        SHUTTER_ACC: ${{ steps.tf-outputs.outputs.shutter_storage_account_name }}
      run: |
        az storage blob upload-batch \
          --account-name "$SHUTTER_ACC" \
          --destination "shutter" \
          --source "extracted-content" \
          --auth-mode login \
          --overwrite true

    - name: Publish deployment summary
      env:
        FD_HOSTNAME: ${{ steps.tf-outputs.outputs.frontdoor_hostname }}
      run: |
        echo "https://$FD_HOSTNAME" >> "$GITHUB_STEP_SUMMARY"
