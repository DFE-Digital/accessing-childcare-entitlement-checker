name: Build dotnet

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false

    secrets:
      SONAR_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOLUTION: Dfe.Acec.slnx
  WEB_APP: src/Dfe.Acec.Web/Dfe.Acec.Web.csproj
  UNIT_TESTS_WEB: tests/Dfe.Acec.Web.Tests.Unit/Dfe.Acec.Web.Tests.Unit.csproj
  UNIT_TESTS_RULES: tests/Dfe.Acec.RulesEngine.Tests.Unit/Dfe.Acec.RulesEngine.Tests.Unit.csproj
  INTEGRATION_TESTS: tests/Dfe.Acec.Web.Tests.Integration/Dfe.Acec.Web.Tests.Integration.csproj
  E2E_TESTS: tests/Dfe.Acec.Web.Tests.E2e/Dfe.Acec.Web.Tests.E2e.csproj
  A11Y_TESTS: tests/Dfe.Acec.Web.Tests.A11y/Dfe.Acec.Web.Tests.A11y.csproj
  CONFIGURATION: Release

jobs:
  dotnet:
    name: CI checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5

      - name: Generate build metadata
        env:
          G_SHA: ${{ github.sha }}
          G_REF: ${{ github.ref_name }}
          G_RUN_ID: ${{ github.run_id }}
          G_CONF: ${{ env.CONFIGURATION }}
        run: |
          jq -n \
            --arg commit "$G_SHA" \
            --arg branch "$G_REF" \
            --arg buildDate "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg dotnetSdk "$(dotnet --version)" \
            --arg configuration "$G_CONF" \
            --arg runId "$G_RUN_ID" \
            '{commit: $commit, branch: $branch, buildDate: $buildDate, dotnetSdk: $dotnetSdk, configuration: $configuration, runId: $runId}' \
            > build-dotnet-metadata.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache dotnet tools
        uses: actions/cache@v6
        with:
          path: ~/.dotnet/tools
          key: tools-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }} --locked-mode

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes

      # Exclusions
      # - `Program.cs` - this is partially tested by an integration test; but awkward to test -
      # - `**/PartnerParentalLeave.cshtml` - this template triggers CPD against `User/ParentalLeave.cshtml`. Deduplicating is awkward
      #   due to govuk tag helpers - we can't easily use a partial. A more comprehensive fix is required, possibly using custom
      #   tag helpers.
      - name: Sonar Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:DFE-Digital_accessing-childcare-entitlement-checker \
            /o:dfe-digital \
            /s:${GITHUB_WORKSPACE}/SonarQube.Analysis.xml \
            /d:sonar.token="${SONAR_TOKEN}"

      - name: Build
        run: >
          dotnet build ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          /p:ContinuousIntegrationBuild=true

      - name: Test
        id: test
        run: |
          dotnet test ${{ env.UNIT_TESTS_WEB }} \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --coverlet \
            --coverlet-output-format opencover \
            --coverlet-include "[Dfe.Acec.*]*"

          dotnet test ${{ env.UNIT_TESTS_RULES }} \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --coverlet \
            --coverlet-output-format opencover \
            --coverlet-include "[Dfe.Acec.*]*"

          dotnet test ${{ env.INTEGRATION_TESTS }} \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --coverlet \
            --coverlet-output-format opencover \
            --coverlet-include "[Dfe.Acec.*]*"

      - name: Sonar End
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Generate coverage report
        if: always()
        continue-on-error: true
        run: |
          dotnet tool run reportgenerator \
            -reports:"**/coverage.opencover*.xml"\
            -targetdir:coverage-report \
            -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"

      - name: Write coverage summary to job summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: Test Results
          path: "**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      - name: Publish Web App
        if: inputs.publish
        run: >
          dotnet publish ${{ env.WEB_APP }}
          -c ${{ env.CONFIGURATION }}
          -o web-app
          --no-build

      - name: Publish e2e Tests
        if: inputs.publish
        run: >
          dotnet publish ${{ env.E2E_TESTS }}
          -c ${{ env.CONFIGURATION }}
          -o e2e-tests
          --no-build

      - name: Publish A11y Tests
        if: inputs.publish
        run: >
          dotnet publish ${{ env.A11Y_TESTS }}
          -c ${{ env.CONFIGURATION }}
          -o a11y-tests
          --no-build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report

      - name: Upload metadata
        uses: actions/upload-artifact@v7
        with:
          name: build-dotnet-metadata
          path: build-dotnet-metadata.json

      - name: Upload Published Web App
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: web-app
          path: web-app

      # We must manually zip these directories before upload.
      # The actions/upload-artifact action's default folder upload behavior
      # excludes hidden directories (like the '.playwright' binaries folder).
      # Zipping them first forces the action to package and upload everything.
      - name: Zip e2e Tests
        if: inputs.publish
        run: zip -r e2e-tests.zip e2e-tests

      - name: Upload Published e2e Tests
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tests
          path: e2e-tests.zip

      # We must manually zip these directories before upload.
      # The actions/upload-artifact action's default folder upload behavior
      # excludes hidden directories (like the '.playwright' binaries folder).
      # Zipping them first forces the action to package and upload everything.
      - name: Zip A11y Tests
        if: inputs.publish
        run: zip -r a11y-tests.zip a11y-tests

      - name: Upload Published A11y Tests
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: a11y-tests
          path: a11y-tests.zip
